name: tpch_analytics

profile: tpch_analytics

# Le projet utilise la syntaxe `data_tests:` (dbt >= 1.10) et les arguments
# sous `arguments:` -> dbt 2.x requis.
require-dbt-version: ">=2.0.0,<3.0.0"

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  tpch_analytics:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # Plage couverte par la dimension des dates (dim_date).
  # Doit contenir toutes les dates présentes dans les faits, sinon les clés
  # étrangères date seraient NULL. TPC-H SF1 : commandes de 1992 à 1998,
  # réception jusqu'à ~4 mois après -> la plage ci-dessous laisse de la marge.
  dim_date_start_date: "1992-01-01"
  dim_date_end_date: "1999-12-31"
