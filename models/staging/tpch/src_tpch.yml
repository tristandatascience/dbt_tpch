version: 2

sources:
  - name: tpch
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: orders
        columns:
          - name: o_orderkey
            tests:
              - unique
              - not_null

      - name: lineitem
        columns:
          - name: l_orderkey
            tests:
              - not_null

      - name: customer
        columns:
          - name: c_custkey
            tests:
              - unique
              - not_null

      - name: part
        columns:
          - name: p_partkey
            tests:
              - unique
              - not_null

      - name: supplier
        columns:
          - name: s_suppkey
            tests:
              - unique
              - not_null

      - name: partsupp
        columns:
          - name: ps_partkey
            tests:
              - not_null
          - name: ps_suppkey
            tests:
              - not_null

      - name: nation
        columns:
          - name: n_nationkey
            tests:
              - unique
              - not_null

      - name: region
        columns:
          - name: r_regionkey
            tests:
              - unique
              - not_null