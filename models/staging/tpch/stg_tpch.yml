version: 2

models:
  - name: stg_tpch_orders
    columns:
      - name: order_key
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']

  - name: stg_tpch_line_items
    columns:
      - name: order_item_key
        tests:
          - unique
          - not_null
      - name: order_key
        tests:
          - not_null
      - name: part_key
        tests:
          - not_null
      - name: supplier_key
        tests:
          - not_null
      - name: return_flag
        tests:
          - accepted_values:
              arguments:
                values: ['R', 'A', 'N']
      - name: line_status
        tests:
          - accepted_values:
              arguments:
                values: ['O', 'F']

  - name: stg_tpch_customers
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: nation_key
        tests:
          - not_null

  - name: stg_tpch_suppliers
    columns:
      - name: supplier_key
        tests:
          - unique
          - not_null
      - name: nation_key
        tests:
          - not_null

  - name: stg_tpch_part
    columns:
      - name: part_key
        tests:
          - unique
          - not_null

  - name: stg_tpch_partsupp
    columns:
      - name: part_supplier_key
        tests:
          - unique
          - not_null
      - name: part_key
        tests:
          - not_null
      - name: supplier_key
        tests:
          - not_null

  - name: stg_tpch_nations
    columns:
      - name: nation_key
        tests:
          - unique
          - not_null
      - name: region_key
        tests:
          - not_null

  - name: stg_tpch_regions
    columns:
      - name: region_key
        tests:
          - unique
          - not_null