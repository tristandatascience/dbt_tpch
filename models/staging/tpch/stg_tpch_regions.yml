version: 2

models:
  - name: stg_tpch_regions
    description: >
      Régions (continents). Grain : une région.
      Transformation : renommage des colonnes de la table region
      (r_regionkey → region_key, r_name → region_name).
    columns:
      - name: region_key
        description: "Clé primaire de la région."
        data_tests:
          - unique
          - not_null
      - name: region_name
        description: "Nom de la région."
      - name: comment
        description: "Commentaire libre sur la région (non exploité analytiquement)."
